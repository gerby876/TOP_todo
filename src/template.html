<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do</title>
</head>
<body>
    <dialog class="projectform">
        <form id="projectform" onsubmit=event.preventDefault()>
            <button class="close"> X </button>
            <div>Title: </div>
            <div><input id="projecttitle" type="text"></div>
            <div>Description: </div>
            <div><textarea class="desc" id="projectdesc" type="text"></textarea></div>
            <div>Due Date: </div>
            <div><input id="projectdue" type="date"></div>
            <div>Priority:  </div>
            <div>
                <select id="projectprio">
                    <option value="low"> Low </option>
                    <option value="mid"> Medium </option>
                    <option value="high"> High </option>
                </select>
            </div>
            <button class="submit">Submit</button>
        </form>
    </dialog>

    <dialog class="taskForm">
        <form id="taskform" onsubmit=event.preventDefault()>
            <button class="closeTask"> X </button>
            <div>Description: </div>
            <div><textarea class="taskdesc" id="taskdesc" type="text"></textarea></div>
            <div>
                Due Date: 
            </div>
            <div>
                <input id="taskdue" type="date">
            </div>
            <div>
                Priority: 
            </div>
            <div>
                <select id="taskprio">
                    <option value="low"> Low </option>
                    <option value="mid"> Medium </option>
                    <option value="high"> High </option>
                </select>
            </div>
        </form>
    </dialog>

    <dialog class="editform">
        <form id="editform" onsubmit=event.preventDefault()>
            <button class="editcloseTask"> X </button>
            <div>Description: </div>
            <div><textarea class="editdesc" id="editdesc" type="text"></textarea></div>
            <div>Due Date: </div>
            <div><input id="editdue" type="date"></div>
            <div>Priority: </div>
            <div>
                <select id="editprio">
                    <option value="low"> Low </option>
                    <option value="mid"> Medium </option>
                    <option value="high"> High </option>
                </select>
            </div>
        </form>
</body>
</html>
